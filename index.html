<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="TYPERINO: a minimal local writing desk with a plain-text essay archive.">
  <title>typerino</title>
  <link rel="icon" type="image/png" href="/icon-no-background.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="bar" aria-label="TYPERINO controls">
    <span class="brand">typerino</span>
    <span class="stretch"></span>
    <button id="archiveBtn" type="button" hidden>[ BACK ]</button>
    <button id="newBtn" type="button" title="New essay (Cmd/Ctrl+N)">[ + NEW ]</button>
    <button id="deleteBtn" type="button" hidden>[ DELETE ]</button>
    <div id="problem" class="problem" role="alert" hidden><span id="problemText"></span><button type="button" id="retryBtn" hidden>[ RETRY ]</button></div>
  </header>
  <main class="paper">
    <section id="archiveView" aria-label="Essay archive">
      <div class="page-inner">
        <div id="archiveList"></div>
        <div id="emptyView" class="empty" hidden><p>NOTHING HERE YET.</p><p>Press [ + NEW ] to write your first essay.</p></div>
        <nav id="pagination" class="pager" aria-label="Archive pages" hidden></nav>
      </div>
    </section>
    <section id="editorView" aria-label="Essay editor" hidden>
      <div class="page-inner">
        <div class="essay-title-row">
          <input id="essayTitle" type="text" maxlength="150" placeholder="UNTITLED" aria-label="Essay title" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off">
        </div>
        <div id="essayBody" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Essay text" data-placeholder="..." title="Section heading: ⌘⇧S · Normal text: ⌘⌥0 · Bold: ⌘B · Italic: ⌘I · Link: ⌘K" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off"></div>
      </div>
    </section>
  </main>
</div>
<dialog id="deleteDialog" aria-labelledby="deleteDialogTitle" aria-describedby="deleteDialogDescription">
  <form method="dialog">
    <h2 id="deleteDialogTitle">DELETE ESSAY?</h2>
    <p id="deleteDialogEssay"></p>
    <p id="deleteDialogDescription">This permanently deletes the essay and its text file.</p>
    <div class="dialog-actions">
      <button type="submit" value="cancel" autofocus>[ CANCEL ]</button>
      <button type="submit" value="delete">[ DELETE ]</button>
    </div>
  </form>
</dialog>
<dialog id="linkDialog" aria-labelledby="linkDialogTitle">
  <form id="linkForm">
    <h2 id="linkDialogTitle">ATTACH LINK</h2>
    <label for="linkUrl">URL</label>
    <input id="linkUrl" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off" spellcheck="false" required autofocus>
    <p id="linkError" role="alert" hidden>Enter a valid http, https, or mailto link.</p>
    <div class="dialog-actions">
      <button id="cancelLink" type="button">[ CANCEL ]</button>
      <button type="submit">[ APPLY ]</button>
    </div>
  </form>
</dialog>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const archiveView = $('archiveView'), editorView = $('editorView');
  const titleInput = $('essayTitle'), bodyInput = $('essayBody');
  // The editor renders safe DOM nodes; formatting is saved as readable Markdown.
  function appendInline(parent, text) {
    const linkPattern = /\[([^\]\n]+)\]\(([^\s)]+)\)/g;
    let link, position = 0;
    while ((link = linkPattern.exec(text))) {
      appendEmphasis(parent, text.slice(position, link.index));
      const href = validLink(link[2], false);
      if (href) {
        const anchor = document.createElement('a');
        anchor.href = href;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        appendEmphasis(anchor, link[1]);
        parent.append(anchor);
      } else parent.append(document.createTextNode(link[0]));
      position = linkPattern.lastIndex;
    }
    appendEmphasis(parent, text.slice(position));
  }
  function appendEmphasis(parent, text) {
    const pattern = /\*\*\*([^\n]+?)\*\*\*|\*\*([^\n]+?)\*\*(?!\*)|\*([^*\n]+)\*/g;
    let start = 0, match;
    while ((match = pattern.exec(text))) {
      parent.append(document.createTextNode(text.slice(start, match.index)));
      const node = document.createElement(match[3] !== undefined ? 'em' : 'strong');
      if (match[1] !== undefined) {
        const italic = document.createElement('em');
        appendInline(italic, match[1]);
        node.append(italic);
      } else appendInline(node, match[2] ?? match[3]);
      parent.append(node);
      start = pattern.lastIndex;
    }
    parent.append(document.createTextNode(text.slice(start)));
  }
  function bodyFragment(text) {
    const fragment = document.createDocumentFragment();
    let list = null;
    for (const line of text.split('\n')) {
      const bullet = /^- (.*)$/.exec(line);
      if (bullet) {
        if (!list) { list = document.createElement('ul'); fragment.append(list); }
        const item = document.createElement('li');
        appendInline(item, bullet[1]);
        if (!item.textContent) item.append(document.createElement('br'));
        list.append(item);
        continue;
      }
      list = null;
      const heading = /^## (.*)$/.exec(line);
      const node = document.createElement(heading ? 'h2' : 'div');
      appendInline(node, heading ? heading[1] : line);
      if (!node.textContent) node.append(document.createElement('br'));
      fragment.append(node);
    }
    return fragment;
  }
  function renderBody(text) {
    bodyInput.replaceChildren(bodyFragment(text));
    if (!text) bodyInput.replaceChildren();
  }
  function inlineText(node) {
    if (node.nodeType === 3) return node.nodeValue;
    if (node.nodeName === 'BR') return '\n';
    const text = Array.from(node.childNodes, inlineText).join('');
    if (node.nodeName === 'A') {
      const href = validLink(node.getAttribute('href'), false);
      if (href) return '[' + text + '](' + href.replace(/\(/g, '%28').replace(/\)/g, '%29') + ')';
    }
    if (/^(STRONG|B)$/.test(node.nodeName) || node.style?.fontWeight === 'bold' || node.style?.fontWeight === '700') return text ? '**' + text + '**' : '';
    if (/^(EM|I)$/.test(node.nodeName) || node.style?.fontStyle === 'italic') return text ? '*' + text + '*' : '';
    return text;
  }
  function readBody(root) {
    const lines = [];
    let inline = '';
    const flush = () => { if (inline) { lines.push(inline); inline = ''; } };
    for (const node of root.childNodes) {
      if (/^(UL|OL)$/.test(node.nodeName)) {
        flush();
        for (const item of node.children) lines.push('- ' + inlineText(item).replace(/\n$/, ''));
      } else if (/^(DIV|P|H[1-6])$/.test(node.nodeName)) {
        flush();
        const nestedBlocks = Array.from(node.children).some(child => /^(DIV|P|UL|OL|H[1-6])$/.test(child.nodeName));
        let text = nestedBlocks ? readBody(node) : inlineText(node);
        if (node.childNodes.length === 1 && node.firstChild.nodeName === 'BR') text = '';
        else text = text.replace(/\n$/, '');
        lines.push((/^H[1-6]$/.test(node.nodeName) ? '## ' : '') + text);
      } else inline += inlineText(node);
    }
    flush();
    return lines.join('\n');
  }
  Object.defineProperty(bodyInput, 'value', {
    get() { return readBody(bodyInput); },
    set(text) { renderBody(text); }
  });
  function editorBlock() {
    let node = window.getSelection()?.anchorNode;
    if (node?.nodeType === 3) node = node.parentElement;
    while (node && node !== bodyInput) {
      if (/^(DIV|P|LI|H[1-6])$/.test(node.nodeName)) return node;
      node = node.parentElement;
    }
    return bodyInput;
  }
  function editorCommand(command, value = null) {
    document.execCommand(command, false, value);
    changed();
  }
  function validLink(value, addScheme = true) {
    let text = (value || '').trim();
    if (!text || /[\s<>]/.test(text)) return null;
    if (addScheme && !/^[a-z][a-z0-9+.-]*:/i.test(text)) text = 'https://' + text;
    try {
      const url = new URL(text);
      if (!['http:', 'https:', 'mailto:'].includes(url.protocol)) return null;
      if (url.protocol !== 'mailto:' && !url.hostname) return null;
      if (url.protocol === 'mailto:' && !url.pathname) return null;
      return url.href;
    } catch (_) { return null; }
  }
  let linkRange = null, linkToApply = null;
  function openLinkDialog() {
    const selection = window.getSelection();
    if (!selection.rangeCount || !bodyInput.contains(selection.anchorNode) || !bodyInput.contains(selection.focusNode)) return;
    let node = selection.anchorNode;
    if (node.nodeType === 3) node = node.parentElement;
    const anchor = node.closest('a');
    linkRange = selection.getRangeAt(0).cloneRange();
    if (selection.isCollapsed) {
      if (!anchor || !bodyInput.contains(anchor)) return;
      linkRange.selectNodeContents(anchor);
    }
    linkToApply = null;
    $('linkUrl').value = anchor?.getAttribute('href') || '';
    $('linkError').hidden = true;
    $('linkDialog').showModal();
    $('linkUrl').select();
  }
  $('cancelLink').addEventListener('click', () => $('linkDialog').close());
  $('linkForm').addEventListener('submit', event => {
    event.preventDefault();
    const href = validLink($('linkUrl').value);
    if (!href) { $('linkError').hidden = false; $('linkUrl').focus(); return; }
    linkToApply = href;
    $('linkDialog').close();
  });
  $('linkDialog').addEventListener('close', () => {
    bodyInput.focus({preventScroll: true});
    if (!linkRange) return;
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(linkRange);
    if (linkToApply) {
      editorCommand('createLink', linkToApply);
      for (const anchor of bodyInput.querySelectorAll('a')) {
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
      }
    }
    linkRange = null;
    linkToApply = null;
  });
  bodyInput.addEventListener('click', event => {
    const anchor = event.target.closest('a');
    if (anchor && (event.metaKey || event.ctrlKey)) {
      const href = validLink(anchor.getAttribute('href'), false);
      if (href) { event.preventDefault(); window.open(href, '_blank', 'noopener,noreferrer'); }
    }
  });
  function toggleHeading() {
    const heading = /^H[1-6]$/.test(editorBlock().nodeName);
    editorCommand('formatBlock', heading ? 'div' : 'h2');
  }
  function autoBullet(event) {
    if (event.isComposing || event.inputType !== 'insertText') return;
    const block = editorBlock();
    if (block.nodeName === 'LI' || block.textContent !== '- ') return;
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(block);
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand('delete');
    document.execCommand('insertUnorderedList');
  }
  const PAGE_SIZE = 50;
  const DRAFT_ID = 'new-unsaved-draft';
  let essays = [], currentId = null, currentEssay = null, page = 0;
  let revision = 0, savedRevision = 0, saveTimer = null;
  let pendingWrite = Promise.resolve(), busy = false;

  async function api(path, options = {}) {
    let response;
    try {
      response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
    } catch (_) {
      throw new Error('Cannot reach the local server. Is server.py still running?');
    }
    let data;
    try { data = await response.json(); }
    catch (_) { throw new Error('Unexpected server response'); }
    if (!response.ok) throw new Error(data.error || 'Request failed');
    return data;
  }
  function showProblem(message, retry = false) {
    $('problemText').textContent = message;
    $('problem').hidden = false;
    $('retryBtn').hidden = !retry;
  }
  function clearProblem() {
    $('problem').hidden = true;
    $('retryBtn').hidden = true;
    $('problemText').textContent = '';
  }
  function dateText(ms) {
    const d = new Date(Number(ms) || Date.now());
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  }
  function titleText(value) {
    return (value || '').replace(/[\r\n\t]+/g, ' ').trim().toUpperCase() || 'UNTITLED DOCUMENT';
  }
  function el(tag, className, content) {
    const result = document.createElement(tag);
    if (className) result.className = className;
    if (content !== undefined) result.textContent = content;
    return result;
  }
  function renderArchive() {
    const host = $('archiveList'); host.replaceChildren();
    const totalPages = Math.max(1, Math.ceil(essays.length / PAGE_SIZE));
    page = Math.min(page, totalPages-1);
    for (const essay of essays.slice(page*PAGE_SIZE, (page+1)*PAGE_SIZE)) {
      const row = el('article', 'archive-row');
      const details = el('div');
      const title = el('button','archive-title',essay.title);
      title.type = 'button';
      title.addEventListener('click',()=>openEssay(essay.id));
      details.append(title);
      row.append(el('span','archive-date',dateText(essay.updatedAt)), details);
      host.append(row);
    }
    $('emptyView').hidden = essays.length !== 0;
    const nav = $('pagination'); nav.replaceChildren(); nav.hidden = totalPages <= 1;
    if (totalPages > 1) {
      const addButton = (label, next, disabled, selected = false) => {
        const button = el('button',selected ? 'current' : '',label);
        button.type = 'button'; button.disabled = disabled;
        button.addEventListener('click',()=>{page = next;renderArchive();window.scrollTo(0,0);});
        nav.append(button);
      };
      addButton('[ < PREV ]', page-1, page===0);
      for (let i=0;i<totalPages;i++) addButton(`[ ${i+1} ]`,i,false,i===page);
      addButton('[ NEXT > ]',page+1,page===totalPages-1);
    }
  }
  async function loadArchive() {
    essays = (await api('/api/essays')).essays;
    renderArchive();
  }
  function showArchiveView() {
    currentId = null;
    archiveView.hidden = false;
    editorView.hidden = true;

    $('archiveBtn').hidden = true;
    $('newBtn').hidden = false;
    $('deleteBtn').hidden = true;
    window.scrollTo(0,0);
  }
  function showEditor(essay, fresh = false) {
    currentEssay = {id: essay.id};
    currentId = essay.id;
    titleInput.value = essay.title === 'UNTITLED ESSAY' ? '' : essay.title;
    bodyInput.value = essay.body;
    revision = 0; savedRevision = 0;
    archiveView.hidden = true;
    editorView.hidden = false;

    $('archiveBtn').hidden = false;
    $('newBtn').hidden = true;
    $('deleteBtn').hidden = false;
    clearProblem();
    window.scrollTo(0,0);
    if (fresh) titleInput.focus();
  }
  function payload() { return {title: titleText(titleInput.value), body: bodyInput.value}; }
  async function saveCurrent() {
    clearTimeout(saveTimer);
    if (!currentId) return true;
    if (currentId === DRAFT_ID && !titleInput.value.trim() && !bodyInput.value.trim()) {
      savedRevision = revision;

      return true;
    }
    if (revision === savedRevision) {
      await pendingWrite.catch(() => {});
      return revision === savedRevision;
    }

    const document = currentEssay, rev = revision, data = payload();
    // Use the latest filename after every serialized save, including queued edits.
    const job = pendingWrite.catch(() => {}).then(async () => {
      const creating = document.id === DRAFT_ID;
      const essay = await api(creating ? '/api/essays' : '/api/essays/' + encodeURIComponent(document.id), {
        method: creating ? 'POST' : 'PUT', body: JSON.stringify(data)
      });
      document.id = essay.id;
      if (currentEssay === document) currentId = essay.id;
      return essay;
    });
    pendingWrite = job;
    try {
      await job;
      if (currentEssay === document) {
        savedRevision = Math.max(savedRevision,rev);
        if (revision === savedRevision) clearProblem();
      }
      return true;
    } catch(error) {
      if (currentEssay === document) {

        showProblem('NOT SAVED: ' + error.message, true);
      }
      return false;
    }
  }
  async function flushEdits() {
    while (currentId && revision !== savedRevision) {
      if (!(await saveCurrent())) return false;
    }
    return true;
  }
  function changed() {
    revision++;

    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { void saveCurrent(); }, 700);
  }
  async function archive() {
    if (busy) return;
    busy = true;
    try {
      if (!(await flushEdits())) return;
      await loadArchive();
      showArchiveView();
      clearProblem();
    } catch(error) { showProblem(error.message, true); }
    finally { busy = false; }
  }
  async function openEssay(id) {
    if (busy) return;
    busy = true;
    try {
      if (!(await flushEdits())) return;
      const essay = await api('/api/essays/' + encodeURIComponent(id));
      showEditor(essay);
    } catch(error) { showProblem(error.message, true); }
    finally { busy = false; }
  }
  async function newEssay() {
    if (busy) return;
    busy = true;
    try {
      if (!(await flushEdits())) return;
      showEditor({id: DRAFT_ID, title: 'UNTITLED ESSAY', body: ''}, true);
    } catch(error) { showProblem(error.message, true); }
    finally { busy = false; }
  }
  function confirmDelete() {
    const dialog = $('deleteDialog');
    $('deleteDialogEssay').textContent = titleText(titleInput.value);
    dialog.returnValue = 'cancel';
    return new Promise(resolve => {
      dialog.addEventListener('close', () => resolve(dialog.returnValue === 'delete'), {once: true});
      dialog.showModal();
    });
  }
  async function deleteEssay() {
    if (!currentId || busy) return;
    busy = true;
    try {
      if (!(await confirmDelete())) return;
      clearTimeout(saveTimer);
      await pendingWrite.catch(() => {});
      if (currentId !== DRAFT_ID) {
        if (!(await flushEdits())) return;
        await api('/api/essays/' + encodeURIComponent(currentId), {method:'DELETE'});
      }
      currentId = null;
      await loadArchive();
      showArchiveView();
      clearProblem();
    } catch(error) { showProblem('COULD NOT DELETE: '+error.message, true); }
    finally { busy = false; }
  }
  titleInput.addEventListener('input',() => {
    const begin = titleInput.selectionStart, end = titleInput.selectionEnd;
    titleInput.value = titleInput.value.toUpperCase().replace(/[\r\n\t]/g,' ');
    titleInput.setSelectionRange(begin,end);
    changed();
  });
  bodyInput.addEventListener('input', event => { autoBullet(event); changed(); });
  function cleanClipboardHtml(html) {
    const source = new DOMParser().parseFromString(html, 'text/html');
    const target = document.createElement('div');
    const copy = (node, parent) => {
      if (node.nodeType === 3) { parent.append(document.createTextNode(node.nodeValue)); return; }
      if (node.nodeType !== 1 || /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|META|LINK|TEMPLATE|INPUT|BUTTON|TEXTAREA|SELECT)$/.test(node.nodeName)) return;
      if (node.nodeName === 'IMG') {
        if (node.getAttribute('alt')) parent.append(document.createTextNode(node.getAttribute('alt')));
        return;
      }
      const tag = node.nodeName.toLowerCase();
      const allowed = ['a', 'b', 'strong', 'em', 'i', 'br', 'p', 'div', 'ul', 'ol', 'li'];
      let name = /^h[1-6]$/.test(tag) ? 'h2' : allowed.includes(tag) ? tag : null;
      const href = tag === 'a' ? validLink(node.getAttribute('href'), false) : null;
      if (tag === 'a' && !href) name = null;
      let destination = parent;
      if (name) {
        destination = document.createElement(name);
        if (name === 'a') {
          destination.href = href;
          destination.target = '_blank';
          destination.rel = 'noopener noreferrer';
        }
        parent.append(destination);
      }
      for (const child of node.childNodes) copy(child, destination);
    };
    for (const node of source.body.childNodes) copy(node, target);
    return target.innerHTML;
  }
  bodyInput.addEventListener('paste', event => {
    event.preventDefault();
    const clipboard = event.clipboardData;
    const html = clipboard.getData('text/html');
    const text = clipboard.getData('text/plain');
    if (html) {
      const cleaned = cleanClipboardHtml(html);
      if (cleaned) { editorCommand('insertHTML', cleaned); return; }
    }
    if (/\[[^\]\n]+\]\([^\s)]+\)/.test(text)) {
      const container = document.createElement('div');
      container.append(bodyFragment(text));
      editorCommand('insertHTML', container.innerHTML);
    } else editorCommand('insertText', text);
  });
  bodyInput.addEventListener('keydown', event => {
    const mod = event.metaKey || event.ctrlKey;
    if (mod && !event.altKey && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      event.stopPropagation();
      openLinkDialog();
    } else if (mod && !event.altKey && ['b', 'i'].includes(event.key.toLowerCase())) {
      event.preventDefault();
      editorCommand(event.key.toLowerCase() === 'b' ? 'bold' : 'italic');
    } else if (mod && event.shiftKey && !event.altKey && event.key.toLowerCase() === 's') {
      event.preventDefault();
      event.stopPropagation();
      toggleHeading();
    } else if (mod && event.altKey && event.code === 'Digit0') {
      event.preventDefault();
      editorCommand('formatBlock', 'div');
    } else if (event.key === 'Enter' && !event.shiftKey && /^H[1-6]$/.test(editorBlock().nodeName)) {
      event.preventDefault();
      document.execCommand('insertParagraph');
      document.execCommand('formatBlock', false, 'div');
      // The normal paragraph starts without inherited heading formatting.
      document.execCommand('removeFormat');
      changed();
    } else if (event.key === 'Tab' && !mod && !event.altKey) {
      event.preventDefault();
      editorCommand('insertText', '    ');
    }
  });
  $('archiveBtn').addEventListener('click',archive);
  $('newBtn').addEventListener('click',newEssay);
  $('deleteBtn').addEventListener('click',deleteEssay);
  $('retryBtn').addEventListener('click',async () => {
    if (currentId) await flushEdits();
    else {
      try { await loadArchive(); clearProblem(); $('newBtn').disabled = false; }
      catch(error) { showProblem(error.message,true); }
    }
  });
  document.addEventListener('keydown',event => {
    if ($('deleteDialog').open || $('linkDialog').open) return;
    const mod = event.metaKey || event.ctrlKey;
    if (mod && !event.shiftKey && !event.altKey && event.key.toLowerCase()==='s') {
      event.preventDefault();
      if (currentId) void flushEdits();
    }
    if (mod && event.key.toLowerCase()==='n') {event.preventDefault(); void newEssay();}
    if (event.key==='Escape' && currentId) {event.preventDefault();void archive();}
  });
  window.addEventListener('beforeunload', event => {
    if (currentId && revision!==savedRevision) {event.preventDefault();event.returnValue='';}
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState==='hidden' && currentId && revision!==savedRevision) void saveCurrent();
  });
  // Keep the server alive while any tab is open, including background tabs.
  function heartbeat() {
    void fetch('/api/heartbeat', {cache: 'no-store'}).catch(() => {});
  }
  heartbeat();
  setInterval(heartbeat, 20000);
  window.addEventListener('pageshow', heartbeat);
  document.addEventListener('visibilitychange', heartbeat);
  (async () => {
    try { await loadArchive(); }
    catch(error) {
      showProblem('CANNOT CONNECT: '+error.message,true);
      $('newBtn').disabled = true;
    }
  })();
})();
</script>
</body>
</html>
