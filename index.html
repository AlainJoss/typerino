<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="TYPERINO: a minimal local writing desk with a plain-text essay archive.">
  <title>typerino</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="bar" aria-label="TYPERINO controls">
    <span class="brand">typerino</span>
    <span class="stretch"></span>
    <button id="archiveBtn" type="button" hidden>[ BACK ]</button>
    <button id="newBtn" type="button" title="New essay (Cmd/Ctrl+N)">[ + NEW ]</button>
    <button id="deleteBtn" type="button" hidden>[ DELETE ]</button>
    <div id="problem" class="problem" role="alert" hidden><span id="problemText"></span><button type="button" id="retryBtn" hidden>[ RETRY ]</button></div>
  </header>
  <main class="paper">
    <section id="archiveView" aria-label="Essay archive">
      <div class="page-inner">
        <div class="archive-heading">ARCHIVE</div>
        <div class="ascii-rule" aria-hidden="true">-------</div>
        <div id="archiveList"></div>
        <div id="emptyView" class="empty" hidden><p>NOTHING HERE YET.</p><p>Press [ + NEW ] to write your first essay.</p></div>
        <nav id="pagination" class="pager" aria-label="Archive pages" hidden></nav>
      </div>
    </section>
    <section id="editorView" aria-label="Essay editor" hidden>
      <div class="page-inner">
        <div class="essay-title-row">
          <span class="title-prefix" aria-hidden="true">---</span>
          <input id="essayTitle" type="text" maxlength="150" placeholder="UNTITLED" aria-label="Essay title" spellcheck="false" autocomplete="off">
        </div>
        <textarea id="essayBody" aria-label="Essay text" placeholder="..." spellcheck="true"></textarea>
      </div>
    </section>
  </main>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const archiveView = $('archiveView'), editorView = $('editorView');
  const titleInput = $('essayTitle'), bodyInput = $('essayBody');
  const PAGE_SIZE = 10;
  const DRAFT_ID = 'new-unsaved-draft';
  let essays = [], currentId = null, currentEssay = null, page = 0;
  let revision = 0, savedRevision = 0, saveTimer = null;
  let pendingWrite = Promise.resolve(), busy = false;

  async function api(path, options = {}) {
    let response;
    try {
      response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
    } catch (_) {
      throw new Error('Cannot reach the local server. Is server.py still running?');
    }
    let data;
    try { data = await response.json(); }
    catch (_) { throw new Error('Unexpected server response'); }
    if (!response.ok) throw new Error(data.error || 'Request failed');
    return data;
  }
  function showProblem(message, retry = false) {
    $('problemText').textContent = message;
    $('problem').hidden = false;
    $('retryBtn').hidden = !retry;
  }
  function clearProblem() {
    $('problem').hidden = true;
    $('retryBtn').hidden = true;
    $('problemText').textContent = '';
  }
  function dateText(ms) {
    const d = new Date(Number(ms) || Date.now());
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  }
  function titleText(value) {
    return (value || '').replace(/[\r\n\t]+/g, ' ').trim().toUpperCase() || 'UNTITLED DOCUMENT';
  }
  function el(tag, className, content) {
    const result = document.createElement(tag);
    if (className) result.className = className;
    if (content !== undefined) result.textContent = content;
    return result;
  }
  function renderArchive() {
    const host = $('archiveList'); host.replaceChildren();
    const totalPages = Math.max(1, Math.ceil(essays.length / PAGE_SIZE));
    page = Math.min(page, totalPages-1);
    for (const essay of essays.slice(page*PAGE_SIZE, (page+1)*PAGE_SIZE)) {
      const row = el('article', 'archive-row');
      const details = el('div');
      const title = el('button','archive-title',essay.title);
      title.type = 'button';
      title.addEventListener('click',()=>openEssay(essay.id));
      details.append(title);
      row.append(el('span','archive-date',dateText(essay.updatedAt)), details);
      host.append(row);
    }
    $('emptyView').hidden = essays.length !== 0;
    const nav = $('pagination'); nav.replaceChildren(); nav.hidden = totalPages <= 1;
    if (totalPages > 1) {
      const addButton = (label, next, disabled, selected = false) => {
        const button = el('button',selected ? 'current' : '',label);
        button.type = 'button'; button.disabled = disabled;
        button.addEventListener('click',()=>{page = next;renderArchive();window.scrollTo(0,0);});
        nav.append(button);
      };
      addButton('[ < PREV ]', page-1, page===0);
      for (let i=0;i<totalPages;i++) addButton(`[ ${i+1} ]`,i,false,i===page);
      addButton('[ NEXT > ]',page+1,page===totalPages-1);
    }
  }
  async function loadArchive() {
    essays = (await api('/api/essays')).essays;
    renderArchive();
  }
  function showArchiveView() {
    currentId = null;
    archiveView.hidden = false;
    editorView.hidden = true;

    $('archiveBtn').hidden = true;
    $('newBtn').hidden = false;
    $('deleteBtn').hidden = true;
    window.scrollTo(0,0);
  }
  function showEditor(essay, fresh = false) {
    currentEssay = {id: essay.id};
    currentId = essay.id;
    titleInput.value = essay.title === 'UNTITLED ESSAY' ? '' : essay.title;
    bodyInput.value = essay.body;
    revision = 0; savedRevision = 0;
    archiveView.hidden = true;
    editorView.hidden = false;

    $('archiveBtn').hidden = false;
    $('newBtn').hidden = true;
    $('deleteBtn').hidden = false;
    clearProblem();
    window.scrollTo(0,0);
    if (fresh) titleInput.focus();
  }
  function payload() { return {title: titleText(titleInput.value), body: bodyInput.value}; }
  async function saveCurrent() {
    clearTimeout(saveTimer);
    if (!currentId) return true;
    if (currentId === DRAFT_ID && !titleInput.value.trim() && !bodyInput.value.trim()) {
      savedRevision = revision;

      return true;
    }
    if (revision === savedRevision) {
      await pendingWrite.catch(() => {});
      return revision === savedRevision;
    }

    const document = currentEssay, rev = revision, data = payload();
    // Use the latest filename after every serialized save, including queued edits.
    const job = pendingWrite.catch(() => {}).then(async () => {
      const creating = document.id === DRAFT_ID;
      const essay = await api(creating ? '/api/essays' : '/api/essays/' + encodeURIComponent(document.id), {
        method: creating ? 'POST' : 'PUT', body: JSON.stringify(data)
      });
      document.id = essay.id;
      if (currentEssay === document) currentId = essay.id;
      return essay;
    });
    pendingWrite = job;
    try {
      await job;
      if (currentEssay === document) {
        savedRevision = Math.max(savedRevision,rev);
        if (revision === savedRevision) clearProblem();
      }
      return true;
    } catch(error) {
      if (currentEssay === document) {

        showProblem('NOT SAVED: ' + error.message, true);
      }
      return false;
    }
  }
  async function flushEdits() {
    while (currentId && revision !== savedRevision) {
      if (!(await saveCurrent())) return false;
    }
    return true;
  }
  function changed() {
    revision++;

    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { void saveCurrent(); }, 700);
  }
  async function archive() {
    if (busy) return;
    busy = true;
    try {
      if (!(await flushEdits())) return;
      await loadArchive();
      showArchiveView();
      clearProblem();
    } catch(error) { showProblem(error.message, true); }
    finally { busy = false; }
  }
  async function openEssay(id) {
    if (busy) return;
    busy = true;
    try {
      if (!(await flushEdits())) return;
      const essay = await api('/api/essays/' + encodeURIComponent(id));
      showEditor(essay);
    } catch(error) { showProblem(error.message, true); }
    finally { busy = false; }
  }
  async function newEssay() {
    if (busy) return;
    busy = true;
    try {
      if (!(await flushEdits())) return;
      showEditor({id: DRAFT_ID, title: 'UNTITLED ESSAY', body: ''}, true);
    } catch(error) { showProblem(error.message, true); }
    finally { busy = false; }
  }
  async function deleteEssay() {
    if (!currentId || busy) return;
    if (currentId === DRAFT_ID) {
      await archive();
      return;
    }
    if (!confirm(`Delete “${titleText(titleInput.value)}”? Its .txt file will be deleted from disk.`)) return;
    busy = true;
    try {
      clearTimeout(saveTimer);
      if (!(await flushEdits())) return;
      await pendingWrite.catch(() => {});
      const deletedId = currentId;
      await api('/api/essays/' + encodeURIComponent(deletedId), {method:'DELETE'});
      currentId = null;
      await loadArchive();
      showArchiveView();
      clearProblem();
    } catch(error) { showProblem('COULD NOT DELETE: '+error.message, true); }
    finally { busy = false; }
  }
  titleInput.addEventListener('input',() => {
    const begin = titleInput.selectionStart, end = titleInput.selectionEnd;
    titleInput.value = titleInput.value.toUpperCase().replace(/[\r\n\t]/g,' ');
    titleInput.setSelectionRange(begin,end);
    changed();
  });
  bodyInput.addEventListener('input', changed);
  bodyInput.addEventListener('keydown',event => {
    if (event.key === 'Tab' && !event.metaKey && !event.ctrlKey && !event.altKey) {
      event.preventDefault();
      bodyInput.setRangeText('    ',bodyInput.selectionStart,bodyInput.selectionEnd,'end');
      changed();
    }
  });
  $('archiveBtn').addEventListener('click',archive);
  $('newBtn').addEventListener('click',newEssay);
  $('deleteBtn').addEventListener('click',deleteEssay);
  $('retryBtn').addEventListener('click',async () => {
    if (currentId) await flushEdits();
    else {
      try { await loadArchive(); clearProblem(); $('newBtn').disabled = false; }
      catch(error) { showProblem(error.message,true); }
    }
  });
  document.addEventListener('keydown',event => {
    const mod = event.metaKey || event.ctrlKey;
    if (mod && event.key.toLowerCase()==='s') {
      event.preventDefault();
      if (currentId) void flushEdits();
    }
    if (mod && event.key.toLowerCase()==='n') {event.preventDefault(); void newEssay();}
    if (event.key==='Escape' && currentId) {event.preventDefault();void archive();}
  });
  window.addEventListener('beforeunload', event => {
    if (currentId && revision!==savedRevision) {event.preventDefault();event.returnValue='';}
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState==='hidden' && currentId && revision!==savedRevision) void saveCurrent();
  });
  // Keep the server alive while any tab is open, including background tabs.
  function heartbeat() {
    void fetch('/api/heartbeat', {cache: 'no-store'}).catch(() => {});
  }
  heartbeat();
  setInterval(heartbeat, 20000);
  window.addEventListener('pageshow', heartbeat);
  document.addEventListener('visibilitychange', heartbeat);
  (async () => {
    try { await loadArchive(); }
    catch(error) {
      showProblem('CANNOT CONNECT: '+error.message,true);
      $('newBtn').disabled = true;
    }
  })();
})();
</script>
</body>
</html>
